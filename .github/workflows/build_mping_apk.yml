name: Build & Sign Mping (iOS 27 Liquid Glass)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mping Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Pull Headless v2ray Core (libv2ray.aar)
        run: |
          mkdir -p app/libs
          echo "Cloning headless libv2ray from 2dust/v2rayNG..."
          git clone --depth 1 https://github.com/2dust/v2rayNG.git /tmp/v2rayNG
          find /tmp/v2rayNG -name "*.aar" -exec cp {} app/libs/ \; || true
          if [ ! -f "app/libs/libv2ray.aar" ]; then
            echo "Fetching prebuilt libv2ray core binary..."
            wget -q "https://github.com/2dust/AndroidLibV2rayLite/releases/latest/download/libv2ray.aar" -O app/libs/libv2ray.aar || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Rename and Sign APK
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "Mping-iOS27-LiquidGlass.apk"
            echo "APK ready: Mping-iOS27-LiquidGlass.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mping-iOS27-LiquidGlass-APK
          path: Mping-iOS27-LiquidGlass.apk
          retention-days: 14

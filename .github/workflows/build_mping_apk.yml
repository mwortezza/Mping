name: Build Mping APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;25.1.8937393 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Download libv2ray.aar Core Binary
        run: |
          mkdir -p app/libs
          if [ ! -f "app/libs/libv2ray.aar" ]; then
            echo "📥 Downloading libv2ray.aar from official release..."
            curl -L "https://github.com/2dust/AndroidLibV2rayLite/releases/latest/download/libv2ray.aar" -o app/libs/libv2ray.aar
          else
            echo "✅ libv2ray.aar already exists locally."
          fi

      - name: Force Compatible Gradle Wrapper
        run: |
          echo "⚙️ Configuring compatible Gradle 8.4 wrapper..."
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK & Prepare Artifact
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} build-output/Mping-iOS27-LiquidGlass.apk \;

      - name: Upload Mping APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mping-iOS27-LiquidGlass-APK
          path: build-output/*.apk
